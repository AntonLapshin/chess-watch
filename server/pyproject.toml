[project]
name = "chess-watch-server"
version = "0.1.0"
description = "Chess Watch relay server: FastAPI + python-chess + SQLite"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-chess>=1.10",
  "aiosqlite>=0.20",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
