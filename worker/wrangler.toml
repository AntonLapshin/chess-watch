# Chess Watch Worker — Cloudflare Worker + Durable Object backend.
#
# Deploy:  make worker-deploy   (attaches the route from CHESS_SERVER_URL
#          in the repo-root .env; see scripts/worker-deploy.sh)
# Local:   make worker-dev      (reads worker/.dev.vars; port 8787)
#
# No route is declared here on purpose: the custom-domain route is
# derived from CHESS_SERVER_URL at deploy time, so the hostname lives in
# exactly one place (the .env value). `workers_dev = true` keeps the
# workers.dev URL working for pre-cutover testing.
name = "chess-watch"
main = "src/index.js"
compatibility_date = "2026-11-21"
workers_dev = true

[vars]
CHESS_P1_NAME = "Aurora"
CHESS_P2_NAME = "Sam"
CHESS_OFFER_TTL = "120"

[[durable_objects.bindings]]
name = "CHESS_GAME"
class_name = "ChessGame"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChessGame"]
