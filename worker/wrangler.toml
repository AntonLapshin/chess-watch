# Chess Watch Worker — Cloudflare Worker + Durable Object backend.
# Replaces the old FastAPI laptop server + Cloudflare Tunnel (see the
# "Migration from the tunnel setup" note in the root README).
#
# Deploy:  wrangler deploy   (after `wrangler secret put` for both tokens)
# Local:   wrangler dev      (reads worker/.dev.vars; port 8787)
name = "chess-watch"
main = "src/index.js"
compatibility_date = "2026-11-21"
workers_dev = true

# The domain is already a Cloudflare zone. Deploying with this route moves
# chess.gulfrenderstudio.com from the (deleted) tunnel CNAME to the Worker.
# Until the cutover, test on the workers.dev URL instead.
route = { pattern = "chess.gulfrenderstudio.com/*", zone_name = "gulfrenderstudio.com" }

[vars]
CHESS_P1_NAME = "Aurora"
CHESS_P2_NAME = "Sam"
CHESS_OFFER_TTL = "120"

[[durable_objects.bindings]]
name = "CHESS_GAME"
class_name = "ChessGame"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChessGame"]
