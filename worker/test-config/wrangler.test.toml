# Test-only Wrangler config for `npm run test:workers`. Mirrors
# worker/wrangler.toml minus the production route, plus fake bearer tokens
# as plain vars. NEVER deploy with this file, and never put real tokens here.
#
# WHY THIS FILE LIVES IN A SUBDIRECTORY: the @cloudflare/vitest-plugin /
# miniflare loads `.dev.vars` from the directory of the Wrangler config
# and lets it override the config's own vars. With the config next to
# worker/.dev.vars (CHANGEME placeholders after `make setup`), the fake
# test tokens here lost and every /api/v1/* call failed with 500
# config_error — so `make worker-test` failed 4/4 on a fresh clone. (Real
# tokens in .dev.vars would break it the other way: the tests send the
# fake tokens and would get 401.) Tried and did not work: `miniflare:
# { vars: {...} }` in the vitest config (the plugin ignores it for this
# path) and `envDir: false`. The subdir has no .dev.vars, so the fake
# tokens in this file win and the integration suite is independent of
# whatever is in worker/.dev.vars.
name = "chess-watch-test"
main = "../src/index.js"
compatibility_date = "2026-11-21"
workers_dev = true

[vars]
CHESS_P1_NAME = "Aurora"
CHESS_P2_NAME = "Sam"
CHESS_OFFER_TTL = "120"
CHESS_TOKEN_P1 = "test-token-p1-0000000000000001"
CHESS_TOKEN_P2 = "test-token-p2-0000000000000002"

[[durable_objects.bindings]]
name = "CHESS_GAME"
class_name = "ChessGame"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChessGame"]
